  else if(a==='rmpin'){ confirmSheet({title:'Remove the PIN lock?', body:'Physiq will open straight to your log, with no code.',
      confirmLabel:'Remove PIN', onYes:()=>{ delete data.pinHash; data.lockSkipped=true; touchSettings(); save(); closeSheet(); showToast('PIN lock removed'); } }); }
  else if(a==='setview'){ data.viewMode=el.dataset.v; touchSettings(); save(); applyViewMode(); menuSheet(); }
  else if(a==='syncsetup'){ syncSheet(); }
  else if(a==='syncconnect'){ const f=supReadForm(); if(!f.url||!f.key||!f.email||!f.pass){ supMsg('Fill in all fields.'); return; } sync.url=f.url; sync.anonKey=f.key; supMsg('Signing in…');
    (async()=>{ try{ await supSignIn(f.email,f.pass); await supFinishConnect(); showToast('Cloud sync connected','good'); }
      catch(e){ sync.enabled=false; sync.token=''; saveSync(); supMsg(typeof e==='string'?e:'Could not connect — check the URL, key, and password.'); setSyncDot('err'); } })(); }
  else if(a==='syncsignup'){ const f=supReadForm(); if(!f.url||!f.key||!f.email||!f.pass){ supMsg('Fill in all fields.'); return; } sync.url=f.url; sync.anonKey=f.key; supMsg('Creating account…');
    (async()=>{ try{ const r=await supSignUp(f.email,f.pass); if(!r.session){ supMsg('Account created — check your email to confirm, then Sign in.'); return; } await supFinishConnect(); showToast('Account created and synced','good'); }
      catch(e){ sync.enabled=false; sync.token=''; saveSync(); supMsg(typeof e==='string'?e:'Could not create account — check the URL and key.'); setSyncDot('err'); } })(); }
  else if(a==='syncnow'){ closeSheet(); setSyncDot('sync'); (async()=>{ try{ const remote=await supPull(); if(remote){ mergeRemote(remote); persistLocal(); render(); } await supPush(); sync.last=nowMs(); saveSync(); setSyncDot('ok'); showToast('Synced','good'); }catch(e){ setSyncDot('err'); showToast('Sync failed — try again','err'); } })(); }
  else if(a==='syncoff'){ confirmSheet({title:'Disconnect cloud sync?', body:'You will be signed out on this device. Your log stays here, and nothing is deleted from the server.',
      confirmLabel:'Sign out', onYes:()=>{ sync=syncDefault(); saveSync(); setSyncDot(); closeSheet(); showToast('Cloud sync disconnected'); } }); }
});
document.addEventListener('change', e=>{
  if(e.target && e.target.id==='dayInput'){ let v=e.target.value; if(!v) return;
    const tk=todayKey(); if(v>tk) v=tk; state.day=v; render(); }
});
document.addEventListener('input', e=>{
  const el=e.target.closest('[data-in]'); if(!el) return;
  const a=el.dataset.in;
  if(a==='tgtcalc'){ updateTgtCalc(); return; }
  if(a==='fdcalc'){ updateFdCalc(); return; }
  if(a==='qtycalc'){ updateQtyCalc(el.dataset.fid); return; }
  if(a==='edcalc'){ updateEdCalc(); return; }
  if(a==='ffcalc'){ updateFfCalc(); return; }
  if(a==='foodsearch'){ state.foodQuery=el.value; const box=document.getElementById('foodresults'); if(box) box.innerHTML=foodResultsHTML(el.value); return; }
  const s=dstore();
  if(a==='setw'||a==='setr'){ const ex=dec(el.dataset.ex),i=+el.dataset.i; const arr=s.sets[ex]||(s.sets[ex]=[]); arr[i]=arr[i]||{}; arr[i][a==='setw'?'w':'r']=el.value; touch(); save(); }
});
/* Keyboard: the app is fully operable without a pointer. */
document.addEventListener('keydown', e=>{
  /* The lock takes keyboard input — essential on a computer, handy on a phone
     with a hardware keyboard. */
  if(document.getElementById('lock').classList.contains('on')){
    if(/^[0-9]$/.test(e.key)){ e.preventDefault(); lockDigit(e.key); return; }
    if(e.key==='Backspace'){ e.preventDefault(); lockDel(); return; }
    return;
  }
  if(e.key==='Escape'){
    const ov=document.getElementById('scanOv'); if(ov&&ov._stop){ ov._stop(); return; }
    if(sheetOpen()){ closeSheet(); return; }
  }
  if(e.key==='Tab' && sheetOpen()){ trapFocus(e); return; }
  const act=e.target.closest && e.target.closest('[data-act][role="button"]');
  if(act && (e.key==='Enter'||e.key===' ')){ e.preventDefault(); act.click(); return; }
  /* Enter in a set field moves to the next one and ticks the row off at the end. */
  if(e.key==='Enter'){
    const inp=e.target.closest && e.target.closest('.setrow input');
    if(inp){ e.preventDefault();
      const row=inp.closest('.setrow'); const ins=[...row.querySelectorAll('input')];
      const at=ins.indexOf(inp);
      if(at<ins.length-1){ ins[at+1].focus(); ins[at+1].select(); }
      else { const chk=row.querySelector('.chk'); if(chk&&!chk.classList.contains('on')) chk.click();
        const next=row.nextElementSibling||row.closest('.ex').nextElementSibling?.querySelector('.setrow');
        const ni=next&&next.querySelector('input'); if(ni){ ni.focus(); ni.select(); } else inp.blur(); }
    }
  }
  /* Left/right arrows walk the day, like a native app's date stepper. */
  if(!sheetOpen() && !/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)){
    if(e.key==='ArrowLeft'){ const b=document.querySelector('[data-act="dayprev"]'); if(b) b.click(); }
    else if(e.key==='ArrowRight'){ const b=document.querySelector('[data-act="daynext"]:not([disabled])'); if(b) b.click(); }
  }
});
/* Selecting the whole value on focus means you overwrite a weight instead of
   editing around it — how every good tracker behaves. */
document.addEventListener('focusin', e=>{
  const i=e.target.closest && e.target.closest('.setrow input, .field[inputmode]');
  if(i && i.value) requestAnimationFrame(()=>{ try{ i.select(); }catch(err){} });
});
/* Chart crosshair for pointer devices. */
document.addEventListener('pointermove', e=>{
  const svg=e.target.closest && e.target.closest('.chart[data-series]'); if(!svg) return;
  let meta; try{ meta=JSON.parse(svg.dataset.series); }catch(err){ return; }
  const g=svg.querySelector('.crosshair'); if(!g||!meta.p.length) return;
  const box=svg.getBoundingClientRect();
  const vx=(e.clientX-box.left)/box.width*meta.W;
  const span=meta.W-meta.padL-meta.padR;
  let idx=Math.round((vx-meta.padL)/span*(meta.p.length-1));
  idx=Math.max(0,Math.min(meta.p.length-1,idx));
  const x=meta.padL+(idx/Math.max(1,meta.p.length-1))*span;
  const v=meta.p[idx][1];
  const y=meta.H-meta.padB-((v-meta.min)/(meta.max-meta.min))*(meta.H-meta.padT-meta.padB);
  g.style.display='';
  g.querySelector('.chx').setAttribute('x1',x); g.querySelector('.chx').setAttribute('x2',x);
  g.querySelector('.chd').setAttribute('cx',x); g.querySelector('.chd').setAttribute('cy',y);
  const lbl=g.querySelector('.chl');
  lbl.setAttribute('x', Math.max(34, Math.min(meta.W-34, x)));
  lbl.textContent=v.toFixed(meta.dec)+' '+meta.unit+' · '+new Date(meta.p[idx][0]+'T00:00').toLocaleDateString(undefined,{month:'short',day:'numeric'});
});
document.addEventListener('pointerleave', e=>{
  const svg=e.target.closest && e.target.closest('.chart[data-series]');
  if(svg){ const g=svg.querySelector('.crosshair'); if(g) g.style.display='none'; }
}, true);

document.getElementById('photoInput').addEventListener('change', function(){
  const f=this.files&&this.files[0]; if(!f) return;
  const img=new Image(); const url=URL.createObjectURL(f);
  img.onload=function(){ const max=420; let w=img.width,h=img.height;
    if(w>h){ if(w>max){ h=h*max/w; w=max; } } else { if(h>max){ w=w*max/h; h=max; } }
    const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
    cv.getContext('2d').drawImage(img,0,0,w,h); URL.revokeObjectURL(url);
    let d; try{ d=cv.toDataURL('image/jpeg',0.72); }catch(err){ d=null; }
    if(d){ const st=dstore(); (st.photos=st.photos||[]).push(d); try{ localStorage.setItem(KEY, JSON.stringify(data)); }catch(err){ showToast('Photo added, but device storage is full — export a backup to keep it','err'); } render(); }
  };
  img.src=url; this.value='';
});
document.getElementById('importInput').addEventListener('change', function(){
  const f=this.files&&this.files[0]; if(!f) return; const rd=new FileReader();
  rd.onload=()=>{ try{ const obj=JSON.parse(rd.result); if(obj&&obj.dates){ data=obj; data.unit=data.unit||'lb'; ensureDefaults(); touchSettings(); save(); closeSheet(); render(); showToast('Backup imported','good'); }
    else showToast('That does not look like a Physiq backup','err'); }catch(e){ showToast('Could not read that file','err'); } };
  rd.readAsText(f); this.value='';
});
function exportData(){ const blob=new Blob([JSON.stringify(data)],{type:'application/json'});
  const u=URL.createObjectURL(blob); const a=document.createElement('a');
  a.href=u; a.download='physiq-backup.json'; a.click(); setTimeout(()=>URL.revokeObjectURL(u),1000); closeSheet(); }

/* ---------------- UTIL ---------------- */
function val(id){ const el=document.getElementById(id); return el?el.value:''; }
function setVal(id,v){ const el=document.getElementById(id); if(el) el.value=v; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function enc(s){ return encodeURIComponent(s); }
function dec(s){ return decodeURIComponent(s); }
function csvRow(a){ return a.map(v=>{ v=(v==null?'':String(v)); return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; }).join(','); }
function exportCSV(){
  const L=[]; const keys=Object.keys(data.dates).sort();
  L.push('DAILY LOG'); L.push(csvRow(['Date','Weekday','Weight ('+data.unit+')','Cardio','Calories','Protein','Carbs','Fat','Workout']));
  keys.forEach(k=>{ const d=data.dates[k], t=dayTotals(k); const wd=WD[new Date(k+'T00:00').getDay()];
    L.push(csvRow([k,wd,d.weight!=null?trimN(toUnitNum(d.weight)):'',d.cardio?'Yes':'',t.kc,t.p,t.c,t.f,sessionDone(k)?'Yes':''])); });
  L.push(''); L.push('FOOD LOG'); L.push(csvRow(['Date','Food','Protein','Carbs','Fat','Calories']));
  keys.forEach(k=>{ (data.dates[k].log||[]).forEach(e=>{ const kc=(+e.p||0)*4+(+e.c||0)*4+(+e.f||0)*9; L.push(csvRow([k,e.name||'',e.p||0,e.c||0,e.f||0,kc])); }); });
  L.push(''); L.push('WORKOUT LOG'); L.push(csvRow(['Date','Exercise','Set','Weight','Reps','Done']));
  keys.forEach(k=>{ const sets=data.dates[k].sets||{}; Object.keys(sets).forEach(ex=>{ (sets[ex]||[]).forEach((st,i)=>{ if(st&&(st.w||st.r)) L.push(csvRow([k,ex,i+1,st.w||'',st.r||'',st.done?'Yes':''])); }); }); });
  L.push(''); L.push('PERSONAL RECORDS'); L.push(csvRow(['Exercise','Best','Est 1RM ('+data.unit+')','Date']));
  getPRs().forEach(p=>{ L.push(csvRow([p.ex,p.type==='w'?(trimN(p.w)+' x '+p.r):(p.r+' reps'),p.type==='w'?trimN(Math.round(p.e)):'',p.date])); });
  const blob=new Blob([L.join('\n')],{type:'text/csv'}); const u=URL.createObjectURL(blob); const a=document.createElement('a');
  a.href=u; a.download='physiq-export.csv'; a.click(); setTimeout(()=>URL.revokeObjectURL(u),1000); closeSheet();
}

document.getElementById('lockPad').addEventListener('click', e=>{ const b=e.target.closest('[data-lk]'); if(!b) return; const k=b.dataset.lk; if(k==='del') lockDel(); else lockDigit(k); });
