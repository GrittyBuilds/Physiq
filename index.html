  /* Metric-matched stand-in, so a decode failure never reflows the layout. */
  @font-face{font-family:'Inter Fallback';src:local('Arial');
    ascent-override:90.2%;descent-override:22.48%;line-gap-override:0%;size-adjust:107.4%}

  /* ===================================================================
     PHYSIQ — design tokens
     One scale for each dimension. Nothing in this file is a one-off:
     if a value isn't here, it doesn't belong in a rule below.
     =================================================================== */
  :root{
    color-scheme:dark;

    /* Surfaces — an elevation ramp, not a pile of greys */
    --bg:#08090B;          /* app ground                      */
    --s1:#101216;          /* card                            */
    --s2:#161A20;          /* inset: fields, tracks, chips    */
    --s3:#1D222A;          /* raised: hover, pressed, badges  */
    --s4:#252B35;          /* highest: keypad, active chip    */

    /* Hairlines */
    --line:rgba(255,255,255,.07);
    --line-2:rgba(255,255,255,.12);
    --hair:rgba(255,255,255,.045);
    /* CONTROL BOUNDARY: only things you can touch get a bright edge. Measured
       at 3.3:1 against every surface in the ramp — WCAG 1.4.11 needs 3:1, and
       the old --line edge was 1.30:1, i.e. invisible. Structure keeps --line. */
    --line-field:rgba(255,255,255,.36);
    --line-field-hover:rgba(255,255,255,.46);
    --track-edge:rgba(255,255,255,.36);

    /* SELECTION: a raised neutral step, never the brand colour. See the
       accent budget below. */
    --sel:var(--s3);
    --sel-strong:var(--s4);
    --sel-line:rgba(255,255,255,.16);

    /* Ink — every step clears WCAG AA on --s1…--s3 */
    --t1:#F4F6F8;          /* primary            17.3:1 on s1 */
    --t2:#AEB6C2;          /* secondary           9.2:1 on s1 */
    --t3:#8A929F;          /* tertiary / labels   6.0:1 on s1 */
    --t4:#767E8B;          /* ornament only — never body copy */

    /* Brand.
       ACCENT BUDGET — teal is permitted on exactly three things per screen:
         1. the single primary action,
         2. the one live or leading datum (energy ring, calorie bar, running timer),
         3. the active navigation item.
       Focus and press feedback are exempt; they are transient, not decoration.
       Anything merely *selected* uses --sel / --sel-line / --t1. A fourth teal
       object on a screen means one of them is wrong. */
    --accent:#2FE3C7;
    --accent-2:#12B9A0;
    --accent-ink:#5CEEDA;                    /* accent as text  */
    --accent-soft:rgba(47,227,199,.10);
    --accent-line:rgba(47,227,199,.26);
    --on-accent:#04130F;                     /* ink on a teal fill */

    /* Data — validated categorical trio (OKLab ΔE, protan/deutan/tritan,
       all-pairs, on the --s1 surface). Deliberately avoids green so it never
       collides with the brand teal or the success state. */
    --macro-p:#D55181;     /* protein */
    --macro-c:#3987E5;     /* carbs   */
    --macro-f:#C98500;     /* fat     */

    /* Status — reserved, never reused as a series colour */
    --good:#3DD68C;
    --warn:#E8A33D;
    --bad:#F0655E;
    --cardio:#E8A33D;      /* week-strip state, kept apart from lift/macros under CVD */
    --good-soft:rgba(61,214,140,.12);
    --bad-soft:rgba(240,101,94,.12);

    /* Type */
    --f-body:'Inter','Inter Fallback',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    --f-display:'Space Grotesk',var(--f-body);
    /* Space Grotesk's tabular "1" carries a foot bar that reads as a strikethrough
       at display size, so anything that must align in a column — timers, tables,
       counters — is set in Inter's tabular figures instead. */
    --f-num:var(--f-body);
    --fs-cap:11px;         /* uppercase micro-label */
    --fs-xs:12px;
    --fs-sm:13px;
    --fs-base:15px;
    --fs-md:16px;
    --fs-lg:18px;
    --fs-xl:21px;
    --fs-2xl:26px;
    --fs-3xl:34px;
    --fs-4xl:46px;
    --lh-tight:1.15;
    --lh-base:1.5;
    --tr-cap:.10em;        /* tracking for uppercase labels */

    /* Space */
    --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px;
    --sp-5:20px; --sp-6:24px; --sp-7:32px; --sp-8:40px;

    /* Radius */
    --r-xs:8px; --r-sm:10px; --r-md:12px; --r-lg:16px; --r-xl:20px; --r-2xl:28px; --r-full:999px;

    /* Elevation */
    --e-1:inset 0 1px 0 rgba(255,255,255,.035), 0 1px 2px rgba(0,0,0,.45);
    --e-2:inset 0 1px 0 rgba(255,255,255,.045), 0 6px 20px -6px rgba(0,0,0,.6);
    --e-3:0 24px 60px -16px rgba(0,0,0,.75), 0 0 0 1px var(--line);
    --e-accent:0 6px 18px -6px rgba(18,185,160,.55), inset 0 1px 0 rgba(255,255,255,.22);
    --focus:0 0 0 2px var(--bg), 0 0 0 4px var(--accent);

    /* Motion */
    --ease:cubic-bezier(.32,.72,0,1);        /* the app's house curve */
    --ease-out:cubic-bezier(.22,1,.36,1);
    --ease-spring:cubic-bezier(.34,1.36,.64,1);
    --d-1:110ms; --d-2:180ms; --d-3:280ms; --d-4:420ms; --d-5:620ms;

    /* Layout */
    --nav-h:66px;
    --side-w:248px;
    --shell-w:1180px;
    --app-w:540px;
    --tap:44px;            /* minimum comfortable target */
    /* viewport-fit=cover opts into the cutout area, so the horizontal insets
       have to be honoured too — otherwise landscape runs under the notch. */
    --sa-l:env(safe-area-inset-left,0px);
    --sa-r:env(safe-area-inset-right,0px);
  }
  @media (prefers-reduced-motion:reduce){
    :root{--d-1:1ms;--d-2:1ms;--d-3:1ms;--d-4:1ms;--d-5:1ms}
    *,*::before,*::after{animation-duration:1ms!important;animation-iteration-count:1!important;
      transition-duration:1ms!important;scroll-behavior:auto!important}
  }


  /* ===================================================================
     BASE
     =================================================================== */
  *,*::before,*::after{box-sizing:border-box}
  *{-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden}
  body{background:var(--bg);color:var(--t1);
    font-family:var(--f-body);font-size:var(--fs-base);line-height:var(--lh-base);
    -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
    overscroll-behavior:none}
  h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:-.018em;line-height:var(--lh-tight);margin:0}
  button,input,select,textarea{font:inherit;color:inherit}
  button{background:none;border:0;padding:0;cursor:pointer;-webkit-user-select:none;user-select:none}
  b,strong{font-weight:650}
  .num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
  .ic{width:1em;height:1em;display:block;flex:none;fill:none;stroke:currentColor;
    stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;overflow:visible}
  .vh{position:absolute!important;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;
    clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap;border:0}

  /* One focus treatment for the whole app. Never removed, only replaced. */
  :where(button,a,input,select,textarea,[tabindex],[role="button"],[role="switch"]):focus-visible{
    outline:2px solid var(--accent);outline-offset:2px;position:relative;z-index:2}

  /* Desktop scrollbars — thin, on-brand, out of the way */
  @media (hover:hover) and (pointer:fine){
    *{scrollbar-width:thin;scrollbar-color:var(--s4) transparent}
    ::-webkit-scrollbar{width:10px;height:10px}
    ::-webkit-scrollbar-track{background:transparent}
    ::-webkit-scrollbar-thumb{background:var(--s3);border:3px solid transparent;
      background-clip:content-box;border-radius:var(--r-full)}
    ::-webkit-scrollbar-thumb:hover{background:var(--s4);background-clip:content-box}
  }

  #app{display:flex;flex-direction:column;height:100%;max-width:var(--app-w);margin:0 auto;
    position:relative;isolation:isolate}

  /* ===================================================================
     HEADER
     =================================================================== */
  .top{position:relative;display:block;z-index:4;
    padding:calc(env(safe-area-inset-top) + var(--sp-3)) var(--sp-4) var(--sp-3);
    background:linear-gradient(180deg,rgba(22,26,32,.92),rgba(8,9,11,.88));
    -webkit-backdrop-filter:blur(20px) saturate(1.4);backdrop-filter:blur(20px) saturate(1.4);
    border-bottom:1px solid var(--line)}
  .topbar{display:flex;align-items:center;gap:var(--sp-3)}
  .topbar .brandicon{height:38px;width:38px;flex:none;display:block;border-radius:11px;
    box-shadow:0 2px 10px rgba(0,0,0,.5), 0 0 0 1px var(--line)}
  .topbar .h{flex:1;min-width:0}
  .top .h h1{font-size:var(--fs-xl);line-height:1.1}
  .top .h .d{font-size:var(--fs-xs);color:var(--t3);margin-top:3px;letter-spacing:.005em}
  .hactions{display:flex;align-items:center;gap:var(--sp-2);flex:none}
  .iconbtn{width:38px;height:38px;border-radius:var(--r-md);border:1px solid var(--line);
    background:var(--s2);color:var(--t2);display:flex;align-items:center;justify-content:center;
    font-size:var(--fs-lg);flex:none;position:relative;
    transition:background var(--d-1) var(--ease),color var(--d-1) var(--ease),transform var(--d-1) var(--ease)}
  .iconbtn .ic{width:20px;height:20px}
  .iconbtn::after{content:"";position:absolute;inset:-4px}          /* 46px hit area */
  .iconbtn:hover{background:var(--s3);color:var(--t1)}
  .iconbtn:active{transform:scale(.94)}

  /* Day navigator */
  .daybar{display:flex;align-items:center;gap:var(--sp-2);padding:var(--sp-3) 0 0;position:relative}
  .daybar[hidden]{display:none}
  .daybar .arw{width:var(--tap);height:38px;border-radius:var(--r-md);border:1px solid var(--line);
    background:var(--s2);color:var(--t2);display:flex;align-items:center;justify-content:center;flex:none;
    transition:background var(--d-1) var(--ease),color var(--d-1) var(--ease),opacity var(--d-1) var(--ease)}
  .daybar .arw .ic{width:19px;height:19px}
  .daybar .arw:hover:not(:disabled){background:var(--s3);color:var(--t1)}
  .daybar .arw:active:not(:disabled){transform:scale(.94)}
  .daybar .arw:disabled{opacity:.3;cursor:default}
  .daybar .lbl{flex:1;min-width:0;position:relative;display:flex;align-items:center;justify-content:center;
    gap:var(--sp-2);height:38px;border-radius:var(--r-md);border:1px solid var(--line);background:var(--s2);
    font-size:var(--fs-sm);font-weight:600;color:var(--t1);cursor:pointer;
    transition:background var(--d-1) var(--ease),border-color var(--d-1) var(--ease)}
  .daybar .lbl:hover{background:var(--s3);border-color:var(--line-2)}
  .daybar .lbl .ic{width:16px;height:16px;color:var(--t3)}
  .daybar .lbl input[type=date]{position:absolute;inset:0;width:100%;height:100%;opacity:0;border:0;padding:0;
    background:transparent;-webkit-appearance:none;appearance:none;pointer-events:none}
  .daybar .today{flex:none;height:38px;padding:0 var(--sp-4);border-radius:var(--r-md);
    border:1px solid var(--sel-line);background:var(--sel);color:var(--t1);
    font-size:var(--fs-xs);font-weight:700;letter-spacing:.01em;
    transition:background var(--d-1) var(--ease)}
  .daybar .today:hover{background:var(--sel-strong)}

  /* ===================================================================
     VIEW / PAGE TRANSITION
     =================================================================== */
  #view{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;
    padding:var(--sp-4) var(--sp-4) calc(var(--nav-h) + env(safe-area-inset-bottom) + var(--sp-7))}
  .fade{animation:viewIn var(--d-3) var(--ease-out) both}
  .fade.from-right{animation-name:viewInR}
  .fade.from-left{animation-name:viewInL}
  @keyframes viewIn{from{opacity:0}to{opacity:1}}
  @keyframes viewInR{from{opacity:0;transform:translate3d(18px,0,0)}to{opacity:1;transform:none}}
  @keyframes viewInL{from{opacity:0;transform:translate3d(-18px,0,0)}to{opacity:1;transform:none}}
  /* The staggered rise runs on a real navigation, never on an in-place update. */
  .viewwrap > .btn{margin-bottom:var(--sp-4)}
  .viewwrap.stagger > *{animation:riseIn var(--d-4) var(--ease-out) both}
  .viewwrap.stagger > *:nth-child(1){animation-delay:0ms}
  .viewwrap.stagger > *:nth-child(2){animation-delay:34ms}
  .viewwrap.stagger > *:nth-child(3){animation-delay:66ms}
  .viewwrap.stagger > *:nth-child(4){animation-delay:96ms}
  .viewwrap.stagger > *:nth-child(5){animation-delay:120ms}
  .viewwrap.stagger > *:nth-child(n+6){animation-delay:140ms}
  @keyframes riseIn{from{opacity:0;transform:translate3d(0,12px,0)}to{opacity:1;transform:none}}


  /* ===================================================================
     SURFACES
     =================================================================== */
  .card{background:var(--s1);border:1px solid var(--line);border-radius:var(--r-lg);
    padding:var(--sp-4);margin-bottom:var(--sp-3);box-shadow:var(--e-1);position:relative}
  .card.tap{cursor:pointer;transition:transform var(--d-1) var(--ease),border-color var(--d-2) var(--ease),background var(--d-2) var(--ease)}
  .card.tap:hover{border-color:var(--line-2);background:var(--s2)}
  .card.tap:active{transform:scale(.99)}
  .card.tap .go{margin-left:auto;color:var(--t2);font-weight:650}
  .card h2{margin:0 0 var(--sp-3);font-size:var(--fs-md);display:flex;align-items:center;gap:var(--sp-2)}
  .card h2 .sub{margin-left:auto;font-size:var(--fs-xs);color:var(--t3);font-weight:500;
    font-family:var(--f-body);letter-spacing:0}
  /* Card header. Sentence case in the display face — uppercase micro-labels
     survive only as structural dividers and micro-badges. */
  .card-k{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-2);
    margin-bottom:var(--sp-3);font-family:var(--f-display);font-size:var(--fs-md);
    font-weight:700;letter-spacing:-.016em;color:var(--t1)}
  .card-k > span:last-child:not(.go){font-family:var(--f-body);font-size:var(--fs-xs);
    font-weight:500;letter-spacing:0;color:var(--t3)}
  .card-k .go{display:inline-flex;align-items:center;gap:3px;color:var(--t2);font-weight:600;
    font-family:var(--f-body);letter-spacing:0;font-size:var(--fs-xs);cursor:pointer;
    padding:2px 0 2px 6px;transition:color var(--d-1) var(--ease)}
  .card-k .go .ic{width:14px;height:14px}
  .card-k .go:hover{color:var(--t1)}
  .sect-title{font-size:var(--fs-cap);letter-spacing:var(--tr-cap);text-transform:uppercase;
    color:var(--t3);font-weight:700;margin:var(--sp-6) var(--sp-1) var(--sp-2)}
  .sect-title:first-child{margin-top:var(--sp-1)}
  .lnk{color:var(--t1);cursor:pointer;font-weight:600;text-underline-offset:3px;
    text-decoration:underline;text-decoration-color:var(--line-2)}
  .lnk:hover{text-decoration-color:currentColor}
  .lnk.sub{color:var(--t3);text-decoration:underline;text-decoration-color:var(--line-2);font-weight:500}
  .lnk.sub:hover{color:var(--t1)}
  .lnk:hover{text-decoration:underline}
  .empty{color:var(--t3);font-size:var(--fs-sm);text-align:center;padding:var(--sp-6) var(--sp-3);
    line-height:var(--lh-base)}
  .empty .ic{width:26px;height:26px;margin:0 auto var(--sp-3);color:var(--t4);stroke-width:1.4}
  .banner{background:var(--s2);border:1px solid var(--line);border-radius:var(--r-md);
    padding:var(--sp-3) var(--sp-3);font-size:var(--fs-xs);color:var(--t2);margin-bottom:var(--sp-3);
    line-height:var(--lh-base);display:flex;gap:var(--sp-3);align-items:flex-start}
  .banner .ic{width:17px;height:17px;flex:none;margin-top:1px;color:var(--t3)}
  .banner b{color:var(--t1);font-weight:650}

  /* ===================================================================
     BUTTONS
     =================================================================== */
  .btn{width:100%;min-height:var(--tap);padding:13px var(--sp-4);border-radius:var(--r-md);border:1px solid transparent;
    font-size:var(--fs-base);font-weight:650;letter-spacing:-.006em;
    display:inline-flex;align-items:center;justify-content:center;gap:var(--sp-2);
    background:linear-gradient(180deg,var(--accent),var(--accent-2));color:var(--on-accent);
    box-shadow:var(--e-accent);margin-top:var(--sp-1);
    transition:transform var(--d-1) var(--ease),filter var(--d-2) var(--ease),box-shadow var(--d-2) var(--ease)}
  .btn .ic{width:18px;height:18px;stroke-width:2}
  .btn:hover{filter:brightness(1.06)}
  .btn:active{transform:translateY(1px) scale(.99);filter:brightness(.94);
    box-shadow:0 2px 8px -4px rgba(18,185,160,.5), inset 0 1px 0 rgba(255,255,255,.18)}
  .btn.ghost{background:var(--s2);color:var(--t1);border-color:var(--line);box-shadow:none}
  .btn.ghost:hover{background:var(--s3);border-color:var(--line-2);filter:none}

  /* .green is kept as an alias so old call sites stay correct: there is one
     primary button in the app, and it is the accent. Green means state. */
  .btn.green{background:linear-gradient(180deg,var(--accent),var(--accent-2));color:var(--on-accent)}
  .btn.danger{background:var(--bad-soft);color:var(--bad);border-color:rgba(240,101,94,.28);box-shadow:none}
  .btn.danger:hover{background:rgba(240,101,94,.2);filter:none}
  .btn.sm{min-height:38px;padding:10px var(--sp-3);font-size:var(--fs-sm);border-radius:var(--r-sm)}
  .btn.auto{width:auto}
  .btn:disabled{opacity:.45;pointer-events:none}
  /* Icon-only square action */
  .iconsq{flex:none;width:var(--tap);min-height:var(--tap);border-radius:var(--r-md);
    border:1px solid var(--sel-line);background:var(--sel);color:var(--t1);
    display:flex;align-items:center;justify-content:center;
    transition:background var(--d-1) var(--ease),transform var(--d-1) var(--ease)}
  .iconsq .ic{width:21px;height:21px}
  .iconsq:hover{background:var(--sel-strong)}
  .iconsq:active{transform:scale(.94)}
  /* Small round action used inside list rows */
  .rowbtn{width:34px;height:34px;flex:none;border-radius:var(--r-sm);border:1px solid var(--line);
    background:var(--s2);color:var(--t3);display:flex;align-items:center;justify-content:center;
    position:relative;transition:background var(--d-1) var(--ease),color var(--d-1) var(--ease),
      border-color var(--d-1) var(--ease),transform var(--d-1) var(--ease)}
  .rowbtn::after{content:"";position:absolute;inset:-5px}     /* 44px hit area */
  .rowbtn .ic{width:16px;height:16px}
  .rowbtn:hover{background:var(--s3);color:var(--t1);border-color:var(--line-2)}
  .rowbtn:active{transform:scale(.92)}
  .rowbtn.accent{border-color:var(--sel-line);background:var(--sel);color:var(--t1)}
  .rowbtn.accent:hover{background:var(--sel-strong);color:var(--t1)}
  .rowbtn.danger:hover{color:var(--bad);border-color:rgba(240,101,94,.35);background:var(--bad-soft)}

  /* ===================================================================
     FORM CONTROLS
     =================================================================== */
  .field{width:100%;min-height:var(--tap);background:var(--s2);border:1px solid var(--line-field);
    border-radius:var(--r-md);color:var(--t1);font-size:var(--fs-md);padding:12px var(--sp-3);
    -webkit-appearance:none;appearance:none;
    transition:border-color var(--d-2) var(--ease),background var(--d-2) var(--ease),box-shadow var(--d-2) var(--ease)}
  .field::placeholder{color:var(--t3);opacity:1}
  .field:hover{border-color:var(--line-field-hover)}
  .field:focus{outline:none;border-color:var(--accent);background:var(--s3);
    box-shadow:0 0 0 3px var(--accent-soft)}
  .row2{display:flex;gap:var(--sp-2)}
  .row2 > *{flex:1;min-width:0}
  .inline{display:flex;gap:var(--sp-2);align-items:center}
  .tgt-grid{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-3);margin-bottom:var(--sp-1)}
  .tgt-f{display:flex;flex-direction:column;gap:var(--sp-2)}
  .tgt-f span{font-size:var(--fs-cap);color:var(--t3);letter-spacing:var(--tr-cap);
    text-transform:uppercase;font-weight:700}

  /* Segmented control — ONE implementation, three sizes.
     Replaces the former .seg / .fuel-seg / .unit-toggle / .restsel button sets. */
  .seg{display:flex;position:relative;background:var(--s2);border:1px solid var(--line);
    border-radius:var(--r-md);padding:3px;gap:2px;margin:0 0 var(--sp-4)}
  .seg button{flex:1;min-width:0;min-height:36px;padding:8px var(--sp-2);border-radius:var(--r-sm);
    color:var(--t3);font-size:var(--fs-sm);font-weight:650;white-space:nowrap;
    transition:color var(--d-2) var(--ease),background var(--d-2) var(--ease)}
  .seg button:hover{color:var(--t1)}
  .seg button.on{background:var(--s4);color:var(--t1);
    box-shadow:0 1px 3px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.07)}
  .seg.sm{border-radius:var(--r-sm);padding:2px}
  .seg.sm button{min-height:38px;padding:6px var(--sp-3);font-size:var(--fs-xs);flex:none}
  .seg.scroll{overflow-x:auto;overscroll-behavior-x:contain;scrollbar-width:none}
  .seg.scroll::-webkit-scrollbar{display:none}
  .seg.scroll button{flex:none}

  /* Chips — scrollable filter pills */
  .chips{display:flex;gap:var(--sp-2);overflow-x:auto;overscroll-behavior-x:contain;padding:2px var(--sp-1) var(--sp-2) 0;
    margin:0 0 var(--sp-3);scrollbar-width:none;scroll-snap-type:x proximity}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:none;min-height:var(--tap);display:inline-flex;align-items:center;gap:7px;
    padding:0 var(--sp-4);border-radius:var(--r-full);border:1px solid var(--line);
    background:var(--s2);color:var(--t2);font-size:var(--fs-sm);font-weight:600;white-space:nowrap;
    cursor:pointer;scroll-snap-align:start;
    transition:background var(--d-2) var(--ease),color var(--d-2) var(--ease),border-color var(--d-2) var(--ease)}
  .chip:hover{background:var(--s3);color:var(--t1)}
  .chip:active{transform:scale(.97)}
  .chip.on{background:var(--sel-strong);color:var(--t1);border-color:var(--sel-line);font-weight:700}
  .chip .ic{width:14px;height:14px}
  .chip .live{width:6px;height:6px;border-radius:50%;background:var(--accent);flex:none;
    box-shadow:0 0 0 3px var(--accent-soft)}
  .chip.rest{opacity:.55}

  /* Toggle switch */
  .switch{margin-left:auto;width:50px;height:31px;border-radius:var(--r-full);background:var(--s4);
    position:relative;flex:none;cursor:pointer;border:1px solid var(--line-field);
    transition:background var(--d-2) var(--ease),border-color var(--d-2) var(--ease)}
  .switch::before{content:"";position:absolute;inset:-7px -4px}
  .switch::after{content:"";position:absolute;top:2px;left:2px;width:25px;height:25px;border-radius:50%;
    background:#EDF0F3;box-shadow:0 2px 5px rgba(0,0,0,.45);
    transition:transform var(--d-3) var(--ease-spring),width var(--d-2) var(--ease)}
  .switch:active::after{width:29px}
  .switch.on{background:var(--good);border-color:transparent}
  .switch.on::after{transform:translateX(19px)}
  .switch.on:active::after{transform:translateX(15px)}

  /* ===================================================================
     PROGRESS: bars & rings
     =================================================================== */
  .bar{height:7px;border-radius:var(--r-full);background:var(--s3);overflow:hidden;position:relative;
    box-shadow:inset 0 0 0 1px var(--track-edge)}
  .bar > i{display:block;height:100%;border-radius:var(--r-full);
    transition:width var(--d-5) var(--ease-out)}
  .macros{flex:1;min-width:0;display:flex;flex-direction:column;gap:var(--sp-3)}

  .ringwrap{display:flex;align-items:center;gap:var(--sp-4)}

  .ring .lbl{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .ring .lbl b{font-family:var(--f-display);font-size:var(--fs-3xl);font-variant-numeric:normal;

  .ring-arc{transition:stroke-dashoffset var(--d-5) var(--ease-out)}


  /* ===================================================================

    border:1px solid var(--sel-line)}

  .menulist{border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden;background:var(--s2);
    margin-bottom:var(--sp-3)}
  .menurow{display:flex;align-items:center;gap:var(--sp-3);padding:13px var(--sp-4);width:100%;
    text-align:left;font-size:var(--fs-base);color:var(--t1);border-top:1px solid var(--hair);
    min-height:var(--tap);transition:background var(--d-1) var(--ease)}
  .menurow:first-child{border-top:none}
  .menurow:hover{background:var(--s3)}
  .menurow:active{background:var(--s4)}
  .menurow .ic{width:19px;height:19px;color:var(--t3);flex:none}
  .menurow .mr-t{flex:1;min-width:0}
  .menurow .mr-t small{display:block;font-size:var(--fs-xs);color:var(--t3);margin-top:2px}
  .menurow .chev{width:16px;height:16px;color:var(--t4);flex:none}
  .menurow .badge{font-size:var(--fs-cap);font-weight:700;color:var(--good);background:var(--good-soft);
    border-radius:var(--r-full);padding:3px 9px;flex:none}
  .menurow.danger{color:var(--bad)}
  .menurow.danger .ic{color:var(--bad)}

  /* ===================================================================
     REST TIMER
     =================================================================== */
  .rest-bar{position:absolute;left:0;right:0;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom));
    max-width:var(--app-w);margin:0 auto;background:rgba(22,26,32,.94);
    -webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);
    border-top:1px solid var(--line-2);display:flex;align-items:center;gap:var(--sp-2);
    padding:var(--sp-3) var(--sp-4);z-index:15;overflow:hidden;
    visibility:hidden;opacity:0;transform:translateY(105%);
    transition:transform var(--d-4) var(--ease),opacity var(--d-2) linear,visibility var(--d-4)}
  .rest-bar.on{visibility:visible;opacity:1;transform:none}
  /* Driven from rAF as a compositor-only transform — a width transition
     restarted by a timer visibly stutters. */
  .rest-bar .prog{position:absolute;left:0;top:0;height:2px;width:100%;background:var(--accent);
    transform-origin:left center;will-change:transform}
  .rest-bar .time{font-family:var(--f-num);font-size:var(--fs-2xl);font-weight:700;
    font-variant-numeric:tabular-nums;color:var(--t1);min-width:70px;letter-spacing:-.02em}
  .rest-bar .lab{font-size:var(--fs-cap);color:var(--t3);text-transform:uppercase;
    letter-spacing:var(--tr-cap);font-weight:700}
  .rest-bar .sp{flex:1}
  .rest-bar button{background:var(--s3);border:1px solid var(--line);color:var(--t1);
    border-radius:var(--r-sm);min-height:38px;padding:8px 11px;font-size:var(--fs-sm);font-weight:650;
    font-family:var(--f-num);font-variant-numeric:tabular-nums;transition:background var(--d-1) var(--ease)}
  .rest-bar button:hover{background:var(--s4)}
  .rest-bar button.skip{background:var(--accent);color:var(--on-accent);border-color:transparent}
  .rest-bar.done .time{color:var(--good)}
  .rest-bar.done .prog{background:var(--good)}

  /* ===================================================================
     TOAST
     =================================================================== */
  .toast{position:absolute;left:50%;z-index:30;
    bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + var(--sp-4));
    display:flex;align-items:center;gap:var(--sp-2);
    background:rgba(29,34,42,.96);color:var(--t1);border:1px solid var(--line-2);
    -webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);
    font-weight:600;font-size:var(--fs-sm);padding:12px var(--sp-4);border-radius:var(--r-full);
    box-shadow:0 14px 36px -12px rgba(0,0,0,.85);max-width:88%;text-align:left;
    opacity:0;pointer-events:none;transform:translateX(-50%) translateY(14px) scale(.96);
    transition:opacity var(--d-3) var(--ease),transform var(--d-3) var(--ease-spring)}
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}
  .toast .ic{width:17px;height:17px;flex:none;color:var(--accent)}
  .toast-undo{margin-left:var(--sp-2);padding:4px var(--sp-2);border-radius:var(--r-xs);
    font-size:var(--fs-sm);font-weight:700;color:var(--accent);flex:none;
    pointer-events:auto;transition:background var(--d-1) var(--ease)}
  .toast-undo:hover{background:var(--accent-soft)}
  .toast:has(.toast-undo){pointer-events:auto}
  .toast.good .ic{color:var(--good)}
  .toast.win{border-color:var(--accent-line);
    box-shadow:0 14px 36px -12px rgba(0,0,0,.85), 0 0 0 1px var(--accent-line)}

  /* A single, one-shot flourish for the moments that deserve one:
     a personal record, a finished session. */
  .flare{position:absolute;inset:0;z-index:29;pointer-events:none;opacity:0}
  .flare.on{animation:flare 1100ms var(--ease-out)}
  @keyframes flare{
    0%{opacity:0;background:radial-gradient(130% 55% at 50% 108%, rgba(47,227,199,.42), transparent 62%)}
    22%{opacity:1}
    100%{opacity:0;background:radial-gradient(190% 90% at 50% 108%, rgba(47,227,199,.30), transparent 70%)}}

  /* ===================================================================
     SYNC INDICATOR
     =================================================================== */
  .sync-dot{width:8px;height:8px;border-radius:50%;background:var(--good);display:none;flex:none;
    box-shadow:0 0 0 3px var(--good-soft)}
  .sync-dot.sync{width:15px;height:15px;background:transparent;box-shadow:none;
    border:2px solid rgba(47,227,199,.25);border-top-color:var(--accent);animation:spin .7s linear infinite}
  .sync-dot.err{background:var(--bad);box-shadow:0 0 0 3px var(--bad-soft)}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* ===================================================================
     PIN LOCK
     =================================================================== */
  .lock{position:absolute;inset:0;z-index:50;display:none;flex-direction:column;align-items:center;
    justify-content:space-between;text-align:center;
    padding:calc(env(safe-area-inset-top) + var(--sp-8)) var(--sp-6) calc(env(safe-area-inset-bottom) + var(--sp-6));
    background:radial-gradient(120% 60% at 50% -8%, #0D1A18, var(--bg) 62%)}
  .lock.on{display:flex;animation:lockIn var(--d-4) var(--ease-out)}
  .lock.leaving{animation:lockOut var(--d-3) var(--ease) forwards;pointer-events:none}
  @keyframes lockOut{to{opacity:0;transform:scale(1.03)}}
  @keyframes lockIn{from{opacity:0}to{opacity:1}}
  .lock-head{display:flex;flex-direction:column;align-items:center}
  .lock-logo-img{width:72px;height:72px;display:block;border-radius:19px;
    box-shadow:0 12px 30px rgba(0,0,0,.65), 0 0 0 1px var(--line)}
  .lock-wordmark{width:172px;max-width:54vw;height:auto;display:block;margin:var(--sp-5) auto 0}
  .lock-tag{margin-top:var(--sp-4);font-family:var(--f-display);font-size:var(--fs-cap);
    letter-spacing:.32em;text-transform:uppercase;color:var(--t4)}
  .lock-prompt{display:flex;flex-direction:column;align-items:center}
  .lock-title{font-family:var(--f-display);font-size:var(--fs-xl);font-weight:700;letter-spacing:-.02em}
  .lock-sub{font-size:var(--fs-sm);color:var(--t3);margin-top:var(--sp-2);min-height:20px}
  .pin-dots{display:flex;gap:var(--sp-5);justify-content:center;margin:var(--sp-6) 0 0}
  .pin-dots i{width:12px;height:12px;border-radius:50%;background:rgba(255,255,255,.05);border:1px solid var(--line-field);
    transition:transform var(--d-2) var(--ease-spring),background var(--d-2) var(--ease),
      border-color var(--d-2) var(--ease),box-shadow var(--d-2) var(--ease)}
  .pin-dots i.f{background:var(--accent);border-color:var(--accent);transform:scale(1.12)}
  .pin-dots.shake{animation:shk .45s var(--ease)}
  @keyframes shk{0%,100%{transform:translateX(0)}18%,58%{transform:translateX(-9px)}38%,78%{transform:translateX(9px)}}
  .lock-keys{display:flex;flex-direction:column;align-items:center}
  .pad{display:grid;grid-template-columns:repeat(3,74px);gap:var(--sp-5) var(--sp-6);justify-content:center}
  .pad button{width:74px;height:74px;border-radius:50%;border:1px solid var(--line);color:var(--t1);
    font-size:var(--fs-2xl);font-weight:500;font-family:var(--f-display);
    display:flex;align-items:center;justify-content:center;background:var(--s2);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.05), 0 2px 8px rgba(0,0,0,.4);
    transition:transform var(--d-1) var(--ease),background var(--d-1) var(--ease),
      border-color var(--d-1) var(--ease),box-shadow var(--d-1) var(--ease)}
  .pad button.blank{background:none;border:none;box-shadow:none;pointer-events:none}
  .pad button.key-fn{color:var(--t3);background:transparent;border-color:transparent;box-shadow:none}
  .pad button .ic{width:26px;height:26px}
  .pad button:hover{background:var(--s3)}
  .pad button:active{transform:scale(.92);background:var(--s4);border-color:var(--accent-line);
    box-shadow:0 0 0 4px var(--accent-soft)}
  .lock-link{margin-top:var(--sp-6);color:var(--t3);font-size:var(--fs-sm);padding:10px var(--sp-4);
    border-radius:var(--r-sm);transition:color var(--d-2) var(--ease),background var(--d-2) var(--ease)}
  .lock-link:hover{color:var(--t1);background:var(--s2)}


  /* ===================================================================
     SAFE AREAS — horizontal insets for landscape on a cutout display.
     env() resolves to 0 everywhere else, so this is inert on other hardware.
     =================================================================== */
  .top,#view,.rest-bar,.sheet{padding-left:calc(var(--sp-4) + var(--sa-l));
    padding-right:calc(var(--sp-4) + var(--sa-r))}
  nav{padding-left:var(--sa-l);padding-right:var(--sa-r)}
  .lock{padding-left:calc(var(--sp-6) + var(--sa-l));padding-right:calc(var(--sp-6) + var(--sa-r))}

  /* ===================================================================
     FORCED COLORS — Windows high-contrast strips backgrounds, so the
     app's meaning has to survive without them.
     =================================================================== */
  @media (forced-colors:active){
    .card,.ex,.tile,.meal,.field,.chip,.seg,.menulist,.foodrow,.pr{border:1px solid CanvasText}
    .bar > i,.fbar i,.dot.s,.dot.m,.dot.c{forced-color-adjust:none;background:Highlight}
    .chk.on,.switch.on{forced-color-adjust:none;background:Highlight;border-color:Highlight}
    nav button.on{outline:2px solid Highlight;outline-offset:-3px}
    nav::after{display:none}
    .top,nav,.sheet,.toast,.rest-bar,.sheet-bg{-webkit-backdrop-filter:none;backdrop-filter:none;background:Canvas}
  }

  /* ===================================================================
     TABLET — two-column content inside the phone-width app frame
     =================================================================== */
  @media (min-width:640px){
    :root{--app-w:720px}
    body.vm-phone{background:radial-gradient(1200px 800px at 50% -10%, #14161B, #050507);
      display:flex;align-items:center;justify-content:center;padding:var(--sp-6)}
    body.vm-phone #app{height:min(100vh - 48px, 940px);height:min(100dvh - 48px, 940px);max-height:940px;border-radius:var(--r-2xl);
      box-shadow:0 40px 90px -30px rgba(0,0,0,.85), 0 0 0 1px var(--line);overflow:hidden;
      background:var(--bg)}
    body.vm-phone #view{padding-left:var(--sp-5);padding-right:var(--sp-5)}
    body.vm-phone .viewwrap{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));
      gap:0 var(--sp-4);align-content:start}
    body.vm-phone .viewwrap > *{grid-column:span 1}
    body.vm-phone .viewwrap > .span2,
    body.vm-phone .viewwrap > .chips,
    body.vm-phone .viewwrap > .seg,
    body.vm-phone .viewwrap > .sect-title,
    body.vm-phone .viewwrap > .restsel,
    body.vm-phone .viewwrap > .setprog,
    body.vm-phone .viewwrap > .lift-legend,
    body.vm-phone .viewwrap > .banner,
    body.vm-phone .viewwrap > .btn,
    body.vm-phone .viewwrap > .tiles,
    body.vm-phone .viewwrap > .hint,
    body.vm-phone .viewwrap > .fuelcard{grid-column:1 / -1}
    body.vm-phone .viewwrap{align-items:stretch}
  }

  /* ===================================================================
     DESKTOP — sidebar + dashboard grid
     =================================================================== */
  .nav-brand,.nav-set{display:none}
  /* Every size in the app flows from these tokens, so a larger canvas needs
     one override rather than a hundred. */
  body.vm-desktop{background:var(--bg);
    --fs-cap:12px; --fs-xs:13px; --fs-sm:14px; --fs-base:16px; --fs-md:17px;
    --fs-lg:20px; --fs-xl:26px; --fs-2xl:32px; --fs-3xl:40px; --fs-4xl:54px;
    --sp-4:18px; --sp-5:22px}
  body.vm-desktop #app{max-width:none;width:100vw;height:100vh;height:100dvh;display:grid;
    grid-template-columns:var(--side-w) minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}

  /* Sidebar */
  body.vm-desktop nav{grid-column:1;grid-row:1 / -1;position:static;height:100dvh;width:auto;
    flex-direction:column;align-items:stretch;justify-content:flex-start;
    border-top:none;border-right:1px solid var(--line);background:#0B0C10;
    padding:var(--sp-5) var(--sp-3) var(--sp-4);gap:2px;
    -webkit-backdrop-filter:none;backdrop-filter:none;overflow-y:auto}
  body.vm-desktop .nav-brand{display:flex;align-items:center;gap:var(--sp-3);
    padding:0 var(--sp-3) var(--sp-6);margin-bottom:var(--sp-2)}
  body.vm-desktop .nav-mark{width:32px;height:32px;flex:none;display:flex;align-items:center;
    justify-content:center;font-family:var(--f-display);font-weight:700;font-size:var(--fs-lg);
    color:var(--on-accent);background:linear-gradient(145deg,#5CEEDA,#12B9A0);border-radius:var(--r-sm);
    box-shadow:0 4px 14px -4px rgba(47,227,199,.5)}
  body.vm-desktop .nav-word{font-family:var(--f-display);font-weight:700;font-size:var(--fs-lg);
    letter-spacing:-.01em;color:var(--t1)}
  body.vm-desktop nav button{flex:none;flex-direction:row;justify-content:flex-start;gap:var(--sp-3);
    padding:10px var(--sp-3);border-radius:var(--r-sm);font-size:var(--fs-sm);font-weight:600;
    color:var(--t3);min-height:40px;
    transition:background var(--d-1) var(--ease),color var(--d-1) var(--ease)}
  body.vm-desktop nav::after{display:none}
  body.vm-desktop nav button svg{width:19px;height:19px}
  body.vm-desktop nav button:hover{background:var(--s2);color:var(--t1)}
  body.vm-desktop nav button.on{background:var(--s3);color:var(--t1)}
  body.vm-desktop nav button.on svg{stroke:var(--accent);transform:none}
  body.vm-desktop .nav-set{display:flex;margin-top:auto}

  /* Header row: title + day nav on one line */
  /* Title, actions and the date stepper share one row, centred on the same
     column the content uses. */
  body.vm-desktop .top{grid-column:2;grid-row:1;position:sticky;top:0;z-index:6;
    display:flex;align-items:center;gap:var(--sp-6);width:100%;
    padding:var(--sp-5) max(var(--sp-7), calc((100% - var(--shell-w)) / 2));
    border-bottom:1px solid var(--line);background:rgba(8,9,11,.85)}
  body.vm-desktop .top .brandicon{display:none}
  body.vm-desktop .top > .topbar{flex:1;min-width:0;gap:var(--sp-4)}
  body.vm-desktop .topbar .h{flex:1;min-width:0}
  body.vm-desktop .top .h .d{font-size:var(--fs-sm)}
  body.vm-desktop .daybar{flex:none;width:auto;padding:0;gap:var(--sp-2)}
  body.vm-desktop .daybar .lbl{flex:none;min-width:200px}
  body.vm-desktop .hactions{order:3}

  /* Content — a real dashboard grid that fills the width */
  body.vm-desktop #view{grid-column:2;grid-row:2;overflow-y:auto;width:100%;
    padding:var(--sp-6) max(var(--sp-7), calc((100% - var(--shell-w)) / 2)) var(--sp-8);scrollbar-gutter:stable}
  /* Cards fill their row so the dashboard never goes ragged; content stays
     top-aligned inside them. */
  body.vm-desktop .viewwrap{display:grid;gap:0 var(--sp-4);align-content:start;align-items:stretch;
    grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}
  body.vm-desktop .viewwrap > .card,body.vm-desktop .viewwrap > .ex{margin-bottom:var(--sp-4)}
  body.vm-desktop .viewwrap > *{grid-column:span 1;min-width:0}
  body.vm-desktop .viewwrap > .span2{grid-column:span 2}
  body.vm-desktop .viewwrap > .chips,
  body.vm-desktop .viewwrap > .seg,
  body.vm-desktop .viewwrap > .sect-title,
  body.vm-desktop .viewwrap > .restsel,
  body.vm-desktop .viewwrap > .setprog,
  body.vm-desktop .viewwrap > .lift-legend,
  body.vm-desktop .viewwrap > .banner,
  body.vm-desktop .viewwrap > .btn,
  body.vm-desktop .viewwrap > .fuelcard{grid-column:1 / -1}
  body.vm-desktop .viewwrap > .fuelcard{max-width:none}
  /* Fuel reads as one instrument plus a log, so give it a real two-column
     shape instead of stacking a full-width summary over full-width sections. */
  body.vm-desktop .viewwrap.vw-fuel{grid-template-columns:minmax(330px,400px) minmax(0,1fr)}
  body.vm-desktop .viewwrap.vw-fuel > .fuelcard{grid-column:1;grid-row:1;margin:0;position:sticky;top:0;align-self:start}
  body.vm-desktop .viewwrap.vw-fuel > .btn{grid-column:1;grid-row:2;width:100%;justify-self:stretch;
    min-width:0;margin-top:var(--sp-3)}
  body.vm-desktop .viewwrap.vw-fuel > .mealgrid{grid-column:2;grid-row:1 / span 3;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:0 var(--sp-4);align-content:start}
  body.vm-desktop .viewwrap.vw-fuel > .mealgrid > .mealsec{margin-bottom:var(--sp-4)}
  @media (max-width:1180px){
    body.vm-desktop .viewwrap.vw-fuel{grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}
    body.vm-desktop .viewwrap.vw-fuel > *{grid-column:1 / -1;grid-row:auto}
    body.vm-desktop .viewwrap.vw-fuel > .fuelcard{position:static}
    body.vm-desktop .viewwrap.vw-fuel > .btn{width:auto;justify-self:start;min-width:220px}
  }
  /* Below 1180 the sidebar spends a quarter of the screen on six words. */
  @media (max-width:1180px){
    body.vm-desktop{--side-w:76px}
    body.vm-desktop .nav-word,body.vm-desktop .nlab{display:none}
    body.vm-desktop nav{padding:var(--sp-5) 10px var(--sp-4);align-items:center}
    body.vm-desktop nav button{justify-content:center;padding:13px 0;gap:0}
    body.vm-desktop .nav-brand{justify-content:center;padding:0 0 var(--sp-5)}
  }
  body.vm-desktop .viewwrap > .seg{max-width:560px}
  body.vm-desktop .viewwrap > .btn{justify-self:start;width:auto;min-width:220px;margin-bottom:var(--sp-4)}
  body.vm-desktop .viewwrap > .tiles,
  body.vm-desktop .viewwrap > .hint,
  body.vm-desktop .viewwrap > .prose{grid-column:1 / -1}
  body.vm-desktop .tiles{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:var(--sp-3)}
  /* Keep measure and control size sane on a wide canvas */
  body.vm-desktop .setprog,body.vm-desktop .restsel,body.vm-desktop .lift-legend{max-width:760px}
  body.vm-desktop .hactions .iconbtn{display:none}
  body.vm-desktop .prose{max-width:70ch}
  /* Rows that stretch full width read better as a two-up list on wide screens */
  body.vm-desktop .photos{grid-template-columns:repeat(6,1fr)}

  /* Overlays anchored to the content column */
  body.vm-desktop .rest-bar{left:var(--side-w);right:0;bottom:0;max-width:none;margin:0;
    padding-left:var(--sp-7);padding-right:var(--sp-7)}
  body.vm-desktop .toast{left:auto;right:var(--sp-7);bottom:var(--sp-6);
    transform:translateY(14px) scale(.96)}
  body.vm-desktop .toast.on{transform:none}
  body.vm-desktop .sheet-bg{background:rgba(4,5,7,.55)}
  body.vm-desktop .sheet{left:auto;right:var(--sp-6);bottom:var(--sp-6);width:430px;max-width:430px;
    margin:0;border-radius:var(--r-xl);border:1px solid var(--line-2);max-height:86vh;overflow-y:auto;
    box-shadow:var(--e-3);padding-bottom:var(--sp-5);
    transform:translateY(16px) scale(.98);opacity:0;visibility:hidden;pointer-events:none;
    transition:opacity var(--d-2) var(--ease),transform var(--d-3) var(--ease-spring),visibility var(--d-3)}
  body.vm-desktop .sheet.on{transform:none;opacity:1;visibility:visible;pointer-events:auto}
  body.vm-desktop .grabber{display:none}
  body.vm-desktop .lock{background:radial-gradient(70% 60% at 50% 0%, #0D1A18, var(--bg) 62%);
    justify-content:center;gap:var(--sp-8);padding:var(--sp-8)}
  body.vm-desktop .lock-wordmark{width:150px;margin-top:var(--sp-4)}
  body.vm-desktop .lock-logo-img{width:60px;height:60px}
  body.vm-desktop .pad{grid-template-columns:repeat(3,64px);gap:var(--sp-4) var(--sp-5)}
  body.vm-desktop .pad button{width:64px;height:64px;font-size:var(--fs-xl)}
  body.vm-desktop .lock-link{margin-top:var(--sp-5)}

  /* Very wide screens: keep line length sane, let the grid breathe */
  @media (min-width:1500px){
    body.vm-desktop{--shell-w:1320px}
    body.vm-desktop .viewwrap{grid-template-columns:repeat(auto-fill,minmax(360px,1fr))}
  }


  /* ===================================================================
     UTILITIES — the small handful of text roles the render functions need,
     so no template has to reach for an inline style.
     =================================================================== */
  .hint{font-size:var(--fs-xs);color:var(--t3);line-height:var(--lh-base)}
  .hint b,.hint strong{color:var(--t1);font-weight:650}
  .hint.c{text-align:center}
  .hint.lead{margin:0 var(--sp-1) var(--sp-3)}
  .hint.tail{margin-top:var(--sp-3)}

/* ---------------- FEEL ----------------
   Haptics, sound and the small motion helpers that make the app read as an
   application rather than a page. Every one of them degrades to nothing when
   the platform (or the user's reduced-motion setting) says no. */
const REDUCED = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)');
function reduced(){ return !!(REDUCED && REDUCED.matches); }
/* Distinct patterns per event, so the phone speaks a small vocabulary
   instead of buzzing the same way for everything. */
const HAPTICS={tap:[8],pick:[12],done:[16,40,22],undo:[10,60,10],win:[22,50,22,50,44],err:[38,60,38],alarm:[130,70,130]};
function haptic(kind){ try{ if(navigator.vibrate) navigator.vibrate(HAPTICS[kind]||HAPTICS.tap); }catch(e){} }

/* One AudioContext, primed on the first real user gesture — iOS refuses to
   start one any other way, which is why the rest alarm used to be silent. */
let AC=null;
function audioCtx(){ try{ const A=window.AudioContext||window.webkitAudioContext; if(!A) return null;
  if(!AC) AC=new A(); if(AC.state==='suspended') AC.resume(); return AC; }catch(e){ return null; } }
function primeAudio(){ const c=audioCtx(); if(c&&c.state==='running') document.removeEventListener('pointerdown',primeAudio); }
document.addEventListener('pointerdown',primeAudio);
function tone(freq,dur,vol){ const a=audioCtx(); if(!a) return;
  const o=a.createOscillator(),g=a.createGain(); o.connect(g); g.connect(a.destination);
  o.type='sine'; o.frequency.value=freq; const t=a.currentTime;
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol||0.14,t+0.015);
  g.gain.exponentialRampToValueAtTime(0.0001,t+(dur||0.3)); o.start(t); o.stop(t+(dur||0.3)+0.02); }
function beep(){ tone(880,0.34,0.15); setTimeout(()=>tone(1174,0.30,0.12),190); }

/* Count a number up to its final value. Cheap, cancels cleanly, and skipped
   entirely under reduced motion. */
function countUp(el,to,opts){
  opts=opts||{}; const from=+opts.from||0, dur=opts.dur||620, fmt=opts.fmt||(n=>Math.round(n).toLocaleString());
  if(reduced()||Math.abs(to-from)<2){ el.textContent=fmt(to); return; }
  const t0=performance.now();
  (function step(now){ const p=Math.min(1,(now-t0)/dur); const e=1-Math.pow(1-p,3);
    el.textContent=fmt(from+(to-from)*e); if(p<1) requestAnimationFrame(step); })(t0);
}
/* Grow every ring and bar in the freshly rendered view from empty to its
   value, instead of stamping it there. */
function animateProgress(root){
  root=root||document; if(reduced()) return;
  root.querySelectorAll('.ring-arc[data-off]').forEach(c=>{
    const to=c.getAttribute('data-off'); const len=c.getAttribute('stroke-dasharray');
    c.setAttribute('stroke-dashoffset',len);
    requestAnimationFrame(()=>requestAnimationFrame(()=>c.setAttribute('stroke-dashoffset',to)));
  });
  root.querySelectorAll('[data-fill]').forEach(i=>{
    const to=i.getAttribute('data-fill'); i.style.width='0%';
    requestAnimationFrame(()=>requestAnimationFrame(()=>{ i.style.width=to; }));
  });
  root.querySelectorAll('[data-count]').forEach(el=>{
    countUp(el,+el.getAttribute('data-count'),{fmt:n=>Math.round(n).toLocaleString()+(el.dataset.suffix||'')});
  });
}

  if(has(/calf/)) out.push('calves');
  if(has(/leg raise|crunch|ab wheel|woodchop|captain|rollout|plank/)) out.push('abs');
  if(out.indexOf('legs')<0){
    if(has(/lateral raise|shoulder press|overhead press|reverse pec deck|face pull|rear delt/)) out.push('shoulders');
    if(has(/\bcurl\b|triceps|pushdown|close-grip|preacher|hammer|skull/)) out.push('arms');
    if(has(/bench|chest press|incline.*press|flat.*press|cable fly|pec deck|\bfly\b|dips/) && !has(/shoulder press|overhead press|reverse pec deck/)) out.push('chest');

/* ---------------- FOCUS BODY PARTS ----------------
   User may pick up to two body parts to emphasize. The classic-physique split
   is preserved; focused muscles get +1 working set on the exercises that already
   hit them, plus one bonus movement — but only on days that already train that
   muscle, so a Push day never sprouts a leg exercise. */
const FOCUS_PARTS = [
  {id:'chest',     name:'Chest',     bonus:{n:'Cable Fly', s:3, r:'12–15', rir:'0–1'}},
  {id:'back',      name:'Back',      bonus:{n:'Chest-Supported Row', s:3, r:'10–12', rir:'0–1'}},
  {id:'shoulders', name:'Shoulders', bonus:{n:'Cable Lateral Raise', s:4, r:'15–20', rir:'0–1', int:'myo'}},
  {id:'arms',      name:'Arms',      bonus:{n:'EZ-bar Curl', s:3, r:'10–12', rir:'0–1'}},
  {id:'legs',      name:'Legs',      bonus:{n:'Leg Extension', s:3, r:'12–15', rir:'0–1'}},
  {id:'calves',    name:'Calves',    bonus:{n:'Standing Calf Raise', s:4, r:'12–15', rir:'0–1'}},
  {id:'abs',       name:'Abs',       bonus:{n:'Hanging Leg Raise', s:3, r:'12–15', rir:'0–1'}},

function activeFocus(){ return (data&&Array.isArray(data.focus))?data.focus.slice(0,2):[]; }
function applyFocus(split){
  const foc=activeFocus(); if(!foc.length) return split;
  const parts=FOCUS_PARTS.filter(p=>foc.indexOf(p.id)>=0); if(!parts.length) return split;
  return split.map(day=>{
    const nd=JSON.parse(JSON.stringify(day)); const trains={};
    nd.blocks.forEach(b=> b.ex.forEach(ex=>{ const ms=musclesOf(ex.n); let boosted=false;
      parts.forEach(p=>{ if(ms.indexOf(p.id)>=0){ trains[p.id]=true;
        if(!boosted && !/hold|sec|posing|vacuum/i.test(String(ex.r))){ ex.s=Math.min((ex.s||0)+1,6); ex.foc=1; boosted=true; } } }); }));
    const active=parts.filter(p=>trains[p.id]);
    if(active.length){
      const bonus=active.map(p=>Object.assign({}, p.bonus, {n:p.bonus.n+' (focus)', foc:1}));

function autoTarget(id){ const d=phaseDefaults(id), bw=latestWeightLb(); if(!bw) return null;

function repRange(r){ r=String(r); if(/hold|sec/i.test(r)) return null;
  const m=r.match(/(\d+)\s*[–-]\s*(\d+)/); if(m) return {lo:+m[1],hi:+m[2]};
  const one=r.match(/^\s*(\d+)/); if(one&&!/\ds\b|s$/i.test(r)) return {lo:+one[1],hi:+one[1]}; return null; }
function fmtWt(w){ w=Math.round(w*100)/100; return (Number.isInteger(w)?w:parseFloat(w.toFixed(2))).toString(); }
/* Suggest next-session load: if every weighted set last time hit the top of the rep
   range, add the smallest plate step and reset to the bottom; otherwise repeat and beat reps. */
function suggestWeight(ex){
  const rr=repRange(ex.r); if(!rr) return null;
  const ls=lastSets(ex.n); if(!ls) return null;
  const done=ls.filter(st=>st.w!==''&&!isNaN(parseFloat(st.w)));
  if(!done.length) return null;
  const lw=Math.max.apply(null, done.map(st=>parseFloat(st.w)));
  if(!isFinite(lw)||lw<=0) return null;
  const maxed=done.every(st=>{ const r=parseInt(st.r,10); return !isNaN(r)&&r>=rr.hi; });
  const kg=data.unit==='kg', inc=rr.hi<=8?(kg?2.5:5):(kg?1.25:2.5);
  if(maxed) return {w:fmtWt(lw+inc), lo:rr.lo, hi:rr.hi, up:true};
  return {w:fmtWt(lw), lo:rr.lo, hi:rr.hi, up:false};
}

/* ---- Barcode scanning (native BarcodeDetector + Open Food Facts) ---- */
async function scanBarcode(){
  if(!('BarcodeDetector' in window)||!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia)){ barcodeUnsupported(); return; }
  let stream; try{ stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}}}); }
  catch(e){ showToast('Camera unavailable — check permissions','err'); return; }
  openScanOverlay(stream);
}
function openScanOverlay(stream){
  const ov=document.createElement('div'); ov.className='scan-ov'; ov.id='scanOv';
  ov.innerHTML=`<video id="scanVid" autoplay muted playsinline></video>
    <div class="scan-frame"><div class="scan-line"></div></div>
    <div class="scan-hint">Point the camera at a barcode</div>
    <button class="scan-cancel" data-act="scancancel">Cancel</button>`;
  document.body.appendChild(ov);
  const vid=ov.querySelector('#scanVid'); vid.srcObject=stream; let stop=false;
  ov._stop=()=>{ stop=true; try{stream.getTracks().forEach(t=>t.stop());}catch(e){} try{ov.remove();}catch(e){} };
  let det; try{ det=new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e','code_128','code_39']}); }catch(e){ det=new BarcodeDetector(); }
  async function loop(){ if(stop) return; try{ const codes=await det.detect(vid); if(codes&&codes.length&&codes[0].rawValue){ const code=codes[0].rawValue; haptic('done'); ov._stop(); onBarcode(code); return; } }catch(e){}
    requestAnimationFrame(loop); }
  vid.onloadedmetadata=()=>{ vid.play().then(loop).catch(()=>loop()); };
}
async function onBarcode(code){
  const known=(data.foods||[]).find(f=>f.barcode===code);
  if(known){ state.sheetMeal=state.fuelMeal||defaultMeal(); foodDetailSheet(known.id); showToast('Found '+known.name,'good'); return; }
  showToast('Looking up '+code+'…');
  const info=await lookupBarcode(code);
  if(info) foodFormSheet(null,{name:info.name,serv:'100 g',p:info.p,c:info.c,f:info.f,barcode:code});
  else { foodFormSheet(null,{barcode:code,serv:'100 g'}); showToast('Not in the database — enter it once and it is remembered'); }
}
async function lookupBarcode(code){
  try{ const ctrl=new AbortController(); const to=setTimeout(()=>ctrl.abort(),6000);
    const r=await fetch('https://world.openfoodfacts.org/api/v2/product/'+encodeURIComponent(code)+'.json?fields=product_name,nutriments',{signal:ctrl.signal});
    clearTimeout(to); if(!r.ok) return null; const j=await r.json();
    if(!j||j.status!==1||!j.product) return null; const n=j.product.nutriments||{};
    const num=v=>{ v=parseFloat(v); return isNaN(v)?0:Math.round(v); };
    return {name:j.product.product_name||('Item '+code), p:num(n.proteins_100g), c:num(n.carbohydrates_100g), f:num(n.fat_100g)};
  }catch(e){ return null; }
}

/* Centred moving average — the line you actually judge progress by, instead of
   the daily scale noise. */
function movingAvg(pts,win){
  if(pts.length<3) return [];
  const half=Math.floor(win/2);
  return pts.map((p,i)=>{ let sum=0,n=0;
    for(let k=Math.max(0,i-half);k<=Math.min(pts.length-1,i+half);k++){ sum+=pts[k].v; n++; }
    return {k:p.k,v:sum/n}; });
}
/* One chart routine for every trend in the app: faint daily marks, a solid
   moving-average line, a recessive grid, direct labels at both ends, and a
   crosshair for pointer devices. */
function chartSVG(pts,trend,opts){
  opts=opts||{};
  if(pts.length<2) return `<div class="empty">${ic('chart')}Log at least two entries to see your trend.</div>`;
  const color=opts.color||'var(--accent)', unit=opts.unit||data.unit, dec=opts.dec==null?1:opts.dec;
  const W=480,H=170,padL=8,padR=8,padT=18,padB=24;
  const all=pts.map(p=>p.v).concat(trend.map(p=>p.v)).concat(opts.target?[opts.target]:[]);
  let min=Math.min(...all), max=Math.max(...all);
  if(min===max){ min-=1; max+=1; }
  const pad=(max-min)*0.14; min-=pad; max+=pad;
  const x=i=>padL+(i/(pts.length-1))*(W-padL-padR);
  const y=v=>H-padB-((v-min)/(max-min))*(H-padT-padB);
  const line=arr=>arr.map((p,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(p.v).toFixed(1)).join(' ');
  const series=trend.length?trend:pts;
  const d=line(series);
  const area=d+` L ${x(series.length-1).toFixed(1)} ${H-padB} L ${x(0).toFixed(1)} ${H-padB} Z`;
  const gid='cg'+(opts.id||'w');
  const grid=[0,.5,1].map(f=>{ const gy=(padT+f*(H-padT-padB)).toFixed(1);
    return `<line class="grid" x1="${padL}" y1="${gy}" x2="${W-padR}" y2="${gy}"/>`; }).join('');
  const dots=pts.map((p,i)=>`<circle cx="${x(i).toFixed(1)}" cy="${y(p.v).toFixed(1)}" r="1.7" fill="${color}" opacity=".38"/>`).join('');
  const lastI=series.length-1, lx=x(lastI), ly=y(series[lastI].v);
  const tgt=opts.target?`<line x1="${padL}" y1="${y(opts.target).toFixed(1)}" x2="${W-padR}" y2="${y(opts.target).toFixed(1)}" stroke="var(--t4)" stroke-dasharray="3 4" stroke-width="1"/>
    <text class="axis" x="${W-padR}" y="${(y(opts.target)-5).toFixed(1)}" text-anchor="end">target ${opts.target}</text>`:'';
  const fmtd=k=>new Date(k+'T00:00').toLocaleDateString(undefined,{month:'short',day:'numeric'});
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img"
      aria-label="${series.length} points, from ${series[0].v.toFixed(dec)} to ${series[lastI].v.toFixed(dec)} ${unit}"
      data-series='${JSON.stringify({p:pts.map(p=>[p.k,+p.v.toFixed(2)]),min,max,W,H,padL,padR,padT,padB,unit,dec})}'>
    <defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="${color}" stop-opacity=".22"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>
    ${grid}${tgt}
    <path d="${area}" fill="url(#${gid})"/>
    ${dots}
    <path d="${d}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${lx.toFixed(1)}" cy="${ly.toFixed(1)}" r="4" fill="${color}" stroke="var(--s1)" stroke-width="2"/>
    <text class="axis" x="${padL}" y="${H-6}">${fmtd(pts[0].k)}</text>
    <text class="axis" x="${W-padR}" y="${H-6}" text-anchor="end">${fmtd(pts[pts.length-1].k)}</text>
    <text class="axis" x="${padL}" y="${(padT-6).toFixed(1)}">${max.toFixed(dec)}</text>
    <g class="crosshair" style="display:none"><line class="chx" y1="${padT}" y2="${H-padB}" stroke="var(--line-2)"/>
      <circle class="chd" r="4" fill="${color}" stroke="var(--s1)" stroke-width="2"/>
      <text class="axis chl" text-anchor="middle" y="${padT-6}" style="fill:var(--t1);font-size:11px"></text></g>
  </svg>`;
}

function keyOf(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function currentMonday(){ const d=new Date(); const off=(d.getDay()+6)%7; d.setDate(d.getDate()-off); d.setHours(0,0,0,0); return d; }
function weekKeys(){ const m=currentMonday(); return Array.from({length:7},(_,i)=>{ const d=new Date(m); d.setDate(m.getDate()+i); return keyOf(d); }); }

/* ---------------- REST TIMER ----------------
   Countdown is anchored to an absolute end-time (wall clock), not a per-second
   decrement, so it stays accurate when the phone screen locks or the tab is
   backgrounded and JS timers are throttled/paused. On return we resync from the
   clock, so the timer has effectively kept progressing while away. */
let restRaf=0, restRemain=0, restInit=120, restEnd=0, restActive=false, _restSec=-1;
function startRest(sec){ stopRestInt(); restInit=sec; restRemain=sec; restEnd=nowMs()+sec*1000;
  restActive=true; _restSec=-1; showRest(); restLoop(); }
/* One rAF loop, anchored to a wall-clock end time. It self-throttles when the
   tab is hidden and catches up on return, so the countdown stays true across a
   screen lock — and the progress bar is a compositor-only transform. */
function restLoop(){
  if(!restActive) return;
  const left=Math.max(0,restEnd-nowMs());
  const p=restInit?left/(restInit*1000):0;
  const pEl=document.getElementById('restprog');
  if(pEl) pEl.style.transform='scaleX('+p.toFixed(4)+')';
  const sec=Math.ceil(left/1000);
  if(sec!==_restSec){ _restSec=sec; restRemain=sec;
    const t=document.getElementById('resttime'); if(t) t.textContent=mmss(Math.max(0,sec));
    if(sec>0&&sec<=3){ haptic('tap'); tone(660,.07,.05); }
  }
  if(left<=0){ restDone(); return; }
  restRaf=requestAnimationFrame(restLoop);
}
function stopRestInt(){ if(restRaf){ cancelAnimationFrame(restRaf); restRaf=0; } }
function paintRest(){ const t=document.getElementById('resttime');
  if(t) t.textContent=mmss(Math.max(0,restRemain));
  const pEl=document.getElementById('restprog');
  if(pEl) pEl.style.transform='scaleX('+(restInit?Math.max(0,restRemain)/restInit:0).toFixed(4)+')'; }
function showRest(){ const el=document.getElementById('restbar'); el.classList.remove('done');
  document.getElementById('restlab').textContent='Rest'; el.classList.add('on'); }
function hideRest(){ restActive=false; stopRestInt();
  const b=document.getElementById('restbar'); b.classList.remove('on'); b.classList.remove('done'); }
function addRest(delta){ if(!restActive) return;
  restEnd=Math.max(nowMs()+1000, restEnd+delta*1000); if(delta>0) restInit+=delta;
  _restSec=-1; haptic('tap'); }
function skipRest(){ restActive=false; stopRestInt(); hideRest(); }
/* Re-sync after the screen unlocks or the tab regains focus — rAF is paused
   while hidden, so restart the loop and let it catch up from the clock. */
function resyncRest(){ if(!restActive) return; stopRestInt();
  if(nowMs()>=restEnd) restDone(); else restLoop(); }
function restDone(){ restActive=false; stopRestInt(); restRemain=0;
  const pEl=document.getElementById('restprog'); if(pEl) pEl.style.transform='scaleX(0)';
  beep(); haptic('alarm');
  const bar=document.getElementById('restbar'); bar.classList.add('done'); bar.setAttribute('aria-live','polite');
  document.getElementById('resttime').textContent='0:00'; document.getElementById('restlab').textContent='Go';
  setTimeout(hideRest,1600); }
function mmss(s){ return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); }

function toUnitNum(lb){ return data.unit==='kg'? lb/2.20462 : lb; }

/* ---------------- SHEETS ----------------
   One modal surface for every secondary flow. It traps focus, closes on Esc or
   a backdrop tap, locks the page behind it, and hands focus back where it came
   from — the things that separate a dialog from a div. */
let _sheetReturn=null;
function sheetOpen(){ return document.getElementById('sheet').classList.contains('on'); }
function openSheet(html){
  const sh=document.getElementById('sheet');
  if(!sheetOpen()) _sheetReturn=document.activeElement;
  sh.innerHTML=`<div class="grabber" aria-hidden="true"></div>`
    +`<button class="sheet-close" data-act="closesheet2" aria-label="Close">${ic('close')}</button>`+html;
  document.querySelector('.sheet-bg').classList.add('on');
  document.body.classList.add('sheet-open');
  /* inert gives focus-trapping, AT-hiding and pointer-blocking in one go.
     The lock is deliberately excluded — a confirmation can be raised over it. */
  document.querySelectorAll('#app > *:not(.sheet):not(.sheet-bg):not(.lock)').forEach(n=>{ n.inert=true; });
  /* Focus the dialog itself. Focusing the first control would raise the
     keyboard on touch and paint a focus ring that reads as a selection. */
  requestAnimationFrame(()=>{ sh.classList.add('on'); sh.focus({preventScroll:true}); });
}
function closeSheet(){
  const sh=document.getElementById('sheet');
  if(!sh.classList.contains('on')) return;
  sh.classList.remove('on','over-lock');
  const bg=document.querySelector('.sheet-bg'); bg.classList.remove('on','over-lock');
  document.body.classList.remove('sheet-open');
  document.querySelectorAll('#app > [inert]').forEach(n=>{ n.inert=false; });
  if(_sheetReturn && document.contains(_sheetReturn)) _sheetReturn.focus({preventScroll:true});
  _sheetReturn=null;
}
/* Drag-to-dismiss. Engages from the grabber, or anywhere once the sheet's own
   scroller is at the top, so it never fights inner scrolling. */
(function(){
  const sh=document.getElementById('sheet'); if(!sh) return;
  let y0=0,dy=0,t0=0,drag=false;
  sh.addEventListener('pointerdown',e=>{
    if(e.pointerType==='mouse') return;
    if(!e.target.closest('.grabber') && sh.scrollTop>0) return;
    if(e.target.closest('input,textarea,select')) return;
    drag=true; y0=e.clientY; dy=0; t0=performance.now();
    sh.classList.add('dragging'); try{ sh.setPointerCapture(e.pointerId); }catch(err){}
  });
  sh.addEventListener('pointermove',e=>{ if(!drag) return;
    dy=Math.max(0,e.clientY-y0);
    sh.style.transform='translate3d(0,'+dy+'px,0)';
    const bg=document.querySelector('.sheet-bg'); if(bg) bg.style.opacity=String(Math.max(0,1-dy/320));
  });
  const end=()=>{ if(!drag) return; drag=false;
    sh.classList.remove('dragging'); sh.style.transform='';
    const bg=document.querySelector('.sheet-bg'); if(bg) bg.style.opacity='';
    const v=dy/Math.max(1,performance.now()-t0);           /* px per ms */
    if(dy>110||v>0.5){ haptic('tap'); closeSheet(); }
  };
  sh.addEventListener('pointerup',end); sh.addEventListener('pointercancel',end);
})();
function trapFocus(e){
  const sh=document.getElementById('sheet'); if(!sh.classList.contains('on')) return;
  const nodes=[...sh.querySelectorAll('a[href],button:not([disabled]),input:not([type=hidden]),select,textarea,[tabindex]:not([tabindex="-1"])')]
    .filter(n=>n.offsetParent!==null);
  if(!nodes.length) return;
  const first=nodes[0], last=nodes[nodes.length-1];
  if(e.shiftKey && document.activeElement===first){ e.preventDefault(); last.focus(); }
  else if(!e.shiftKey && document.activeElement===last){ e.preventDefault(); first.focus(); }
}

function lockDel(){ buf=buf.slice(0,-1); updateDots(); }
function lockShake(){ const el=document.getElementById('lockDots'); el.classList.add('shake'); haptic('err'); setTimeout(()=>el.classList.remove('shake'),450); }
function lockComplete(){
  if(lockMode==='create'){ firstPin=buf; buf=''; lockMode='confirm'; renderLock(); }
  else if(lockMode==='confirm'){ if(buf===firstPin){ data.pinHash=hashPin(buf); data.lockSkipped=false; touchSettings(); save(); buf=''; firstPin=''; hideLock(); }
    else { lockShake(); buf=''; firstPin=''; lockMode='create'; setTimeout(renderLock,430); } }
  else { if(hashPin(buf)===data.pinHash){ buf=''; hideLock(); } else { lockShake(); buf=''; setTimeout(updateDots,430); } }
}

/* ---------------- CLOUD SYNC (Supabase) ----------------
   One JSON blob per user in the `tracker_data` table, protected by
   Row-Level Security. Auth is email + password via the GoTrue REST API;
   data goes through PostgREST. No external library — plain fetch, so the
   app stays a single self-contained file. Config (project URL + anon key
   + session tokens) is stored only on this device. */
const SB_ROW='tracker_data';
function syncDefault(){ return {enabled:false,url:'',anonKey:'',email:'',token:'',refresh:'',userId:'',last:0}; }
function loadSync(){ try{ const r=localStorage.getItem('sb_sync'); if(r){ const o=JSON.parse(r); if(o&&typeof o==='object'&&'url'in o) return Object.assign(syncDefault(),o); } }catch(e){} return syncDefault(); }
function saveSync(){ try{ localStorage.setItem('sb_sync', JSON.stringify(sync)); }catch(e){} }
function syncPayload(){ const d=JSON.parse(JSON.stringify(data)); Object.keys(d.dates||{}).forEach(k=>{ if(d.dates[k]) delete d.dates[k].photos; }); return JSON.stringify(d); }
/* Auth (GoTrue) */
async function supAuth(path,body){ const r=await fetch(sync.url+'/auth/v1/'+path,{method:'POST',headers:{'apikey':sync.anonKey,'Content-Type':'application/json'},body:JSON.stringify(body)}); const j=await r.json().catch(()=>({})); return {ok:r.ok,status:r.status,j}; }
function supSetSession(j){ sync.token=j.access_token; sync.refresh=j.refresh_token||sync.refresh; sync.userId=(j.user&&j.user.id)||sync.userId; if(j.user&&j.user.email) sync.email=j.user.email; }
async function supSignIn(email,password){ const {ok,j}=await supAuth('token?grant_type=password',{email,password}); if(!ok||!j.access_token) throw (j.error_description||j.msg||j.message||'Sign-in failed'); sync.email=email; supSetSession(j); }
async function supSignUp(email,password){ const {ok,j}=await supAuth('signup',{email,password}); if(!ok) throw (j.error_description||j.msg||j.message||'Sign-up failed'); sync.email=email; if(j.access_token){ supSetSession(j); return {session:true}; } return {session:false}; }
async function supRefresh(){ try{ const {ok,j}=await supAuth('token?grant_type=refresh_token',{refresh_token:sync.refresh}); if(ok&&j.access_token){ supSetSession(j); saveSync(); return true; } }catch(e){} return false; }
/* Data (PostgREST) — retries once through a token refresh on 401 */
async function supFetch(path,opts,_retry){ opts=opts||{};
  const h=Object.assign({'apikey':sync.anonKey,'Authorization':'Bearer '+sync.token}, opts.headers||{});
  const r=await fetch(sync.url+path, Object.assign({},opts,{headers:h}));
  if(r.status===401 && !_retry && sync.refresh){ if(await supRefresh()) return supFetch(path,opts,true); }
  return r; }
async function supPull(){ const r=await supFetch('/rest/v1/'+SB_ROW+'?select=payload&limit=1',{headers:{'Accept':'application/json'}}); if(!r.ok) throw 0; const a=await r.json(); return (Array.isArray(a)&&a.length&&a[0].payload)?a[0].payload:null; }
async function supPush(){ if(!sync.userId) return; const body=[{user_id:sync.userId, payload:JSON.parse(syncPayload()), updated_at:new Date().toISOString()}];
  const r=await supFetch('/rest/v1/'+SB_ROW,{method:'POST',headers:{'Content-Type':'application/json','Prefer':'resolution=merge-duplicates,return=minimal'},body:JSON.stringify(body)}); if(!r.ok) throw 0; }
function mergeRemote(remote){ if(!remote||typeof remote!=='object') return;
  const rd=remote.dates||{}, ld=data.dates||{}, out={};
  new Set([...Object.keys(ld),...Object.keys(rd)]).forEach(k=>{ const a=ld[k], b=rd[k];
    let pick; if(a&&b){ pick=((b._u||0)>(a._u||0))?Object.assign({},b):Object.assign({},a); } else pick=Object.assign({}, a||b);
    if(a&&a.photos) pick.photos=a.photos; out[k]=pick; });
  data.dates=out;
  if((remote.updatedAt||0)>(data.updatedAt||0)){ ['unit','restDefault','deloadWeeks','blockStart','pinHash','lockSkipped','foods','rotationPos','rotationByPhase','phase','phaseTargets','phaseMode','focus','presetsRemoved','mealsV3'].forEach(f=>{ if(remote[f]!==undefined) data[f]=remote[f]; }); data.updatedAt=remote.updatedAt; }
}
let pushTimer=null;
function schedulePush(){ if(!sync.enabled) return; setSyncDot('sync'); clearTimeout(pushTimer); pushTimer=setTimeout(async()=>{ try{ await supPush(); sync.last=nowMs(); saveSync(); setSyncDot('ok'); }catch(e){ setSyncDot('err'); } }, 1600); }
async function startupSync(){ if(!(sync.enabled&&sync.token&&sync.userId)) return; setSyncDot('sync'); try{ const remote=await supPull(); if(remote){ mergeRemote(remote); persistLocal(); render(); } await supPush(); sync.last=nowMs(); saveSync(); setSyncDot('ok'); }catch(e){ setSyncDot('err'); } }
function setSyncDot(s){ const el=document.getElementById('syncDot'); if(!el) return; if(!sync.enabled){ el.style.display='none'; return; } el.style.display='block'; el.className='sync-dot '+(s||'ok'); }
function syncSheet(){

    <div class="prose" style="margin-bottom:var(--sp-3)">Sync your log across phone and computer with your own <b>Supabase</b> project. Your keys and sign-in are saved only on this device.</div>
    <div class="hint" style="margin-bottom:var(--sp-3)">Find your <b>Project URL</b> and <b>anon public key</b> in Supabase, under Project Settings &rsaquo; API.</div>
    <div class="stack">
      <input class="field" id="supurl" placeholder="Project URL (https://xxxx.supabase.co)" autocomplete="off" autocapitalize="off" spellcheck="false" value="${esc(sync.url||'')}" aria-label="Supabase project URL">

      <input class="field" id="supemail" type="email" placeholder="Email" autocomplete="email" autocapitalize="off" spellcheck="false" value="${esc(sync.email||'')}" aria-label="Email">

async function supFinishConnect(){ const remote=await supPull(); if(remote) mergeRemote(remote); sync.enabled=true; sync.last=nowMs(); saveSync(); persistLocal(); await supPush(); saveSync(); setSyncDot('ok'); closeSheet(); render(); }

/* ---------------- LIVE VIEW UPDATES ----------------
   Small, surgical DOM updates for the interactions that happen dozens of times
   a session. Re-rendering the whole tab for a checkbox is what made the old
   build feel like a web page. */
function markExerciseComplete(exEl, exName){
  if(!exEl) return;
  const boxes=[...exEl.querySelectorAll('.chk')];
  exEl.classList.toggle('complete', boxes.length>0 && boxes.every(b=>b.classList.contains('on')));
}
function paintSetProgress(){
  const wrap=document.querySelector('.setprog'); if(!wrap) return;
  const done=document.querySelectorAll('#view .chk.on').length;
  const planned=document.querySelectorAll('#view .chk').length;
  const b=wrap.querySelector('b'); if(b) b.textContent=done;
  const i=wrap.querySelector('.bar > i'); if(i) i.style.width=pctOf(done,planned)+'%';
}
